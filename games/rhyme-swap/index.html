<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6ee">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<link rel="icon" href="../../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kids Games">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Rhyme &amp; Swap — change one letter</title>
<link rel="stylesheet" href="../../shared/style.css?v=6">
</head>
<body>

<div class="bar">
  <a class="back" href="../../index.html" aria-label="Back to games">‹</a>
  <span class="title">Rhyme &amp; Swap</span>
  <span class="badge" id="levelBadge">Set 1</span>
</div>

<div class="wrap">
  <div class="dots" id="dots"></div>

  <div id="gate" class="card" style="margin-top:24px;text-align:center">
    <h2>Change one letter</h2>
    <p>Same ending, new first letter. Listen, then tap it.</p>
    <button class="big-btn primary" id="startBtn" style="width:100%;margin-top:10px">Start</button>
  </div>

  <main id="game" class="hidden">
    <div class="say-row">
      <button class="say-btn" id="sayBtn" aria-label="Hear the word again">🔊</button>
    </div>
    <div class="say-note">tap to hear the new word</div>

    <div class="prompt" id="prompt">Change cat into…</div>
    <div class="slots" id="slots"></div>

    <div class="feedback" id="feedback"></div>
    <div class="choices numbers rhyme" id="choices"></div>
  </main>

  <div id="summary" class="card hidden" style="margin-top:24px;text-align:center">
    <h2 id="sumTitle">Nice work</h2>
    <p id="sumSub"></p>
    <div class="stat-row">
      <div class="stat"><b id="sumRight">0</b><span>right</span></div>
      <div class="stat"><b id="sumNew">0</b><span>new words</span></div>
      <div class="stat"><b id="sumMiss">0</b><span>to practice</span></div>
    </div>
    <button class="big-btn primary" id="againBtn" style="width:100%">Play again</button>
    <p style="margin-top:16px"><a href="../../index.html">Back to the games</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../../shared/learn.js?v=5"></script>
<script src="../../shared/pwa.js?v=1"></script>
<script src="../../shared/speech.js?v=6"></script>
<script src="../../shared/words.js?v=5"></script>
<script src="../../shared/decks.js?v=6"></script>
<script src="../../shared/confetti.js?v=8"></script>
<script src="../../shared/sound.js?v=2"></script>
<script>
(function () {
  'use strict';

  // no child selected: send them to the picker rather than silently writing
  // one kid's answers into another kid's progress
  if (!Learn.activePlayer()) { location.replace('../../index.html'); return; }

  var DECK = 'rhyme';
  var LIMIT = 12;
  var MAX_LEVEL = Decks.rhyme.maxLevel;
  var ONSETS = 'bcdfghjklmnprstvwz'.split('');

  var el = function (id) { return document.getElementById(id); };
  var state = {
    session: null,
    item: null,
    q: null,
    base: '',
    locked: true,
    levelMoves: 0,
    retry: [],
    recent: []
  };

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderDots() {
    var box = el('dots');
    box.innerHTML = '';
    for (var i = 0; i < LIMIT; i++) {
      var d = document.createElement('i');
      var r = state.session && state.session.results ? state.session.results[i] : null;
      if (r === true) d.className = 'good';
      else if (r === false) d.className = 'bad';
      box.appendChild(d);
    }
  }

  function updateBadge() {
    el('levelBadge').textContent = 'Set ' + Learn.level(DECK);
  }

  function nextItem() {
    var pool = Decks.rhyme.pool(Learn.level(DECK));
    var id;

    if (state.retry.length) {
      id = state.retry.shift();
    } else {
      id = Learn.pick(DECK, pool, state.recent.slice(-2));
    }
    if (!id) id = pool[0];

    var q = Decks.rhyme.parse(id);
    var family = (Words.families && Words.families[q.rime]) || [q.word];
    var others = family.filter(function (w) { return w !== q.word; });
    // any other word in the family works as the starting point
    var base = others.length ? others[Math.floor(Math.random() * others.length)] : q.rime;

    state.item = id;
    state.q = q;
    state.base = base;
    state.locked = false;

    state.recent.push(id);
    if (state.recent.length > 4) state.recent.shift();

    el('prompt').textContent = 'Change ' + base + ' into…';
    el('feedback').textContent = '';
    el('feedback').className = 'feedback';

    drawSlots(q, false);
    drawChoices(q, family);
    updateBadge();

    Speak.preload([q.word]);
    Speak.word(q.word);
  }

  function drawSlots(q, reveal) {
    var host = el('slots');
    host.innerHTML = '';

    var first = document.createElement('div');
    first.className = 'slot blank' + (reveal ? ' good' : '');
    first.textContent = reveal ? q.answer : '';
    host.appendChild(first);

    for (var i = 1; i < q.word.length; i++) {
      var cell = document.createElement('div');
      cell.className = 'slot given';
      cell.textContent = q.word.charAt(i);
      host.appendChild(cell);
    }
  }

  function drawChoices(q, family) {
    var host = el('choices');
    host.innerHTML = '';

    // exactly four: the answer, up to three other onsets from the family, then
    // plain consonants if the family is small
    var others = [];
    family.forEach(function (w) {
      var c = w.charAt(0);
      if (c !== q.answer && others.indexOf(c) === -1) others.push(c);
    });
    var letters = [q.answer].concat(shuffle(others).slice(0, 3));
    shuffle(ONSETS).forEach(function (c) {
      if (letters.length < 4 && letters.indexOf(c) === -1) letters.push(c);
    });

    shuffle(letters).forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'choice letter';
      b.textContent = c;
      b.addEventListener('click', function () { answerWith(b, c); });
      host.appendChild(b);
    });
  }

  function answerWith(btn, c) {
    if (state.locked || !state.item) return;
    state.locked = true;

    var q = state.q;
    var right = (c === q.answer);
    var wasNew = Learn.get(DECK, state.item).seen === 0;

    Learn.record(DECK, state.item, right);
    var move = Learn.adapt(DECK, right, MAX_LEVEL, {
      allowUp: state.levelMoves === 0,
      allowDown: state.levelMoves === 0
    });
    if (move.changed) state.levelMoves += 1;
    state.session.track(state.item, right, wasNew);

    if (right) {
      btn.classList.add('good', 'pop');
      drawSlots(q, true);
      el('feedback').textContent = state.base + ' becomes ' + q.word;
      el('feedback').className = 'feedback good';
      Sound.fanfare();
      Confetti.rain(95);
      setTimeout(function () { Speak.word(q.word); }, 420);
      if (move.changed > 0) toast('Set ' + move.level);
    } else {
      btn.classList.add('bad');
      Array.prototype.forEach.call(el('choices').children, function (b) {
        if (b.textContent === q.answer) b.classList.add('good');
      });
      drawSlots(q, true);
      el('feedback').textContent = q.answer + ' makes ' + q.word;
      el('feedback').className = 'feedback bad';
      Speak.word(q.word);
      if (state.retry.indexOf(state.item) === -1) state.retry.push(state.item);
      if (move.changed < 0) toast('Back to set ' + move.level);
    }

    Array.prototype.forEach.call(el('choices').children, function (b) { b.disabled = true; });
    renderDots();
    setTimeout(finishTurn, right ? 1600 : 2500);
  }

  function finishTurn() {
    if (state.session.done()) { showSummary(); return; }
    nextItem();
  }

  function showSummary() {
    var s = state.session;
    el('game').classList.add('hidden');
    el('dots').classList.add('hidden');
    el('summary').classList.remove('hidden');

    var pct = s.answered ? Math.round((s.correct / s.answered) * 100) : 0;
    el('sumTitle').textContent = pct >= 80 ? 'Excellent' : pct >= 50 ? 'Good work' : 'Good try';
    el('sumSub').textContent = s.missed.length
      ? 'Words to practice again: ' + s.missed.map(function (id) {
          return Decks.rhyme.parse(id).word;
        }).slice(0, 6).join(', ')
      : 'Every word right. Well done.';
    el('sumRight').textContent = s.correct;
    el('sumNew').textContent = s.newItems.length;
    el('sumMiss').textContent = s.missed.length;
  }

  function startSession() {
    state.session = new Learn.Session({ limit: LIMIT });
    state.session.results = [];
    state.retry = [];
    state.recent = [];
    state.levelMoves = 0;

    var track = state.session.track.bind(state.session);
    state.session.track = function (item, correct, wasNew) {
      state.session.results[state.session.answered] = correct;
      track(item, correct, wasNew);
    };

    el('gate').classList.add('hidden');
    el('summary').classList.add('hidden');
    el('game').classList.remove('hidden');
    el('dots').classList.remove('hidden');
    renderDots();
    nextItem();
  }

  el('startBtn').addEventListener('click', function () {
    Speak.unlock();
    Sound.unlock();
    startSession();
  });

  el('againBtn').addEventListener('click', function () {
    Speak.unlock();
    Sound.unlock();
    startSession();
  });

  el('sayBtn').addEventListener('click', function () {
    if (state.q) Speak.word(state.q.word);
  });

  renderDots();
  updateBadge();
})();
</script>
</body>
</html>
